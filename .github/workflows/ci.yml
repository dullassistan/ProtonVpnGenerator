name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: |
        dotnet restore ProtonVpnGenerator.csproj
        dotnet restore Tests/ProtonVpnGenerator.Tests/ProtonVpnGenerator.Tests.csproj

    - name: Build
      run: |
        dotnet build ProtonVpnGenerator.csproj --configuration Release --no-restore
        dotnet build Tests/ProtonVpnGenerator.Tests/ProtonVpnGenerator.Tests.csproj --configuration Release --no-restore

    - name: Run Tests
      run: dotnet test Tests/ProtonVpnGenerator.Tests/ProtonVpnGenerator.Tests.csproj --configuration Release --no-build --verbosity normal
